name: Sandbox Check
# Builds and tests the opt-in sandbox tree (sandbox/, see sandbox/README.md), which a default build never
# compiles. Runs on every PR — not just PRs touching sandbox/** — because the sandbox fixture engine is the
# CI guard for the generic engine extension points (KNNEngineDefinition registration, JNIService dispatch,
# query-parameter deferral), and a core refactor can break that seam without touching sandbox files.
# Mirrors the OpenSearch core sandbox convention of a dedicated flag-enabled workflow. Pure JVM: the fixture
# engine needs no native build and no test cluster.
on:
  push:
    branches:
      - "*"
      - "feature/**"
  pull_request:
    branches:
      - "*"
      - "feature/**"

jobs:
  sandbox-check:
    strategy:
      matrix:
        java: [21, 25]
    name: Build and test the sandbox with -Pknn.sandbox.enabled=true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout k-NN
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Java ${{ matrix.java }}
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      - name: Run sandbox tests
        # -p sandbox runs the test task of every sandbox subproject (mirroring core's `check -p sandbox`),
        # so a new tenant's unit tests join CI with zero workflow changes.
        run: ./gradlew -p sandbox test -Pknn.sandbox.enabled=true
